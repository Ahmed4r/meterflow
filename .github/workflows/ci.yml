name: Verify MeterFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash backend/mvnw -B -f backend/pom.xml verify spotless:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run typecheck && npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create ephemeral configuration
        run: |
          cp .env.example .env
          sed -i "s/^DATABASE_PASSWORD=.*/DATABASE_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 48)/" .env
          sed -i "s/^DEMO_PASSWORD=.*/DEMO_PASSWORD=$(openssl rand -hex 16)/" .env
      - run: docker compose up --build -d
      - name: Wait for application
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health > /dev/null && curl -fsS http://localhost:3000/login > /dev/null; do sleep 3; done'
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results
      - run: docker compose down
        if: always()
